<!doctype html><title>V004 readiness regression matrix</title><style>body{font:14px system-ui;background:#eee}iframe{display:block;border:0}pre{white-space:pre-wrap}</style><button id="run">Run readiness matrix</button><pre id="status">ready</pre><div id="frame"></div><pre id="report"></pre><script>
let cases=[{name:'cold',activity:true},{name:'warm',activity:true},{name:'practice'},{name:'unfocused',unfocused:true,activity:true},{name:'narrow-reduced',narrow:true,reduced:true,activity:true},...[100,250,1000,5000].map(warmup=>({name:'warmup-'+warmup,warmup,activity:true})),{name:'decode-5000',decode:5000,activity:true},{name:'active-stall',stall:250,activity:true},{name:'load-failure',fail:true,activity:true},{name:'timeout',timeout:true,activity:true},{name:'cancel-stale',decode:1000,activity:true},{name:'play-again',activity:true}];
if(location.search.includes('cold'))cases=cases.filter(s=>['cold','warm'].includes(s.name));
if(location.search.includes('subset'))cases=cases.filter(s=>['narrow-reduced','load-failure','cancel-stale','play-again'].includes(s.name));
let layout=[],frame,latest={events:[]};const results=[];const sleep=ms=>new Promise(r=>setTimeout(r,ms));
window.addEventListener('message',e=>{if(e.data?.diagnostic==='timeline'){latest=e.data;if(latest.phase==='playing'){const doc=frame.contentDocument;const canvas=doc.querySelector('.game-canvas canvas');const controls=Array.from(doc.querySelectorAll('.control-button')).map(e=>{const r=e.getBoundingClientRect();return {height:r.height,bottom:r.bottom};});layout.push({width:Number(frame.width),height:Number(frame.height),canvasWidth:canvas?.width,canvasHeight:canvas?.height,overflow:doc.documentElement.scrollWidth>Number(frame.width),controls});}document.querySelector('#report').textContent=JSON.stringify(latest,null,2);}});
const button=name=>Array.from(frame.contentDocument.querySelectorAll('#root button')).find(b=>b.textContent.trim()===name&&!b.disabled);
async function until(f,ms=22000){const end=performance.now()+ms;while(!f()){if(performance.now()>end)throw Error('bounded wait');await sleep(30);}}
function check(v,why){if(!v)throw Error(why);}
async function save(){await fetch('/evidence',{method:'POST',body:JSON.stringify(results)});}
function validate(spec,ev){const ready=ev.find(e=>e.event==='RENDERER_READY'),countdown=ev.find(e=>e.event==='COUNTDOWN_START'),first=ev.find(e=>e.event==='CLOCK_FIRST');check(ready&&countdown&&first,'ready/countdown/clock absent');check(ready.ms<=countdown.ms&&countdown.ms+2390<=first.ms,'early countdown/clock');check(ev.filter(e=>e.event==='FRAME_RENDERED').every(e=>e.v004&&!e.legacy),'non-V004 frame');check(ev.filter(e=>e.event==='ATTEMPT_ISSUED').every(e=>e.ms>=ready.ms),'early official issuance');check(!ev.some(e=>e.event==='CLOCK_INTERRUPTED')||spec.stall,'readiness-induced pause');}
document.querySelector('#run').onclick=async()=>{try{for(const spec of cases){latest={events:[]};layout=[];frame=document.createElement('iframe');frame.width=spec.narrow?375:1280;frame.height=spec.narrow?667:720;const q=new URLSearchParams();for(const [k,v]of Object.entries(spec))if(k!=='name')q.set(k,v===true?'1':v);frame.src='/candidate.html?'+q;document.querySelector('#frame').replaceChildren(frame);await until(()=>frame.contentDocument?.querySelector('#root button'));await until(()=>button('Start Game'));await sleep(250);if(!spec.unfocused)frame.contentWindow.focus();button('Start Game').click();button('Start Game')?.click();
 if(spec.fail||spec.timeout){await until(()=>latest.phase==='error');check(!latest.events.some(e=>['COUNTDOWN_START','ATTEMPT_ISSUED','CLOCK_FIRST'].includes(e.event)),'failed load started run');if(spec.fail){for(let n=0;n<2;n++){button('Retry').click();button('Retry')?.click();await sleep(400);await until(()=>latest.phase==='error');}check(!button('Retry'),'unbounded retry');}button('Back').click();await until(()=>latest.phase==='home');}
 else if(spec.name==='cancel-stale'){await until(()=>latest.phase==='preparing');button('Back').click();await sleep(1600);check(!latest.events.some(e=>['ATTEMPT_ISSUED','COUNTDOWN_START'].includes(e.event)),'stale start');button('Start Game').click();await until(()=>latest.phase==='results');validate(spec,latest.events);button('Play Again').click();await until(()=>latest.phase==='preparing');button('Back').click();await until(()=>latest.phase==='results');await sleep(1200);check(latest.events.filter(e=>e.event==='ATTEMPT_ISSUED').length===1,'canceled Play Again issued attempt');}
 else {await until(()=>['paused','results'].includes(latest.phase));if(spec.stall){check(latest.phase==='paused','active stall not interrupted');button('Resume').click();await until(()=>latest.phase==='results');}validate(spec,latest.events);if(spec.name==='play-again'){for(let n=0;n<4;n++){button('Play Again').click();await until(()=>latest.phase==='preparing'||latest.phase==='countdown');await until(()=>latest.phase==='results');}check(latest.events.filter(e=>e.event==='ATTEMPT_ISSUED').length===5,'duplicate/missing attempt');check(!latest.events.some(e=>e.event==='CLOCK_INTERRUPTED'),'repeat readiness pause');}}
 const doc=frame.contentDocument;check(doc.documentElement.scrollWidth<=Number(frame.width),'horizontal overflow');results.push({spec,phase:latest.phase,events:latest.events,listeners:latest.listeners,layout,canvasCount:doc.querySelectorAll('canvas').length});await save();document.querySelector('#status').textContent='passed '+results.length+' / '+cases.length;}
 document.querySelector('#status').textContent='PASS '+results.length;
 }catch(e){document.querySelector('#status').textContent='FAIL '+results.length+' '+e.message;results.push({failure:e.message,events:latest.events});await save();}};
</script>
